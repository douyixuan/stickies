name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core tests — data, migration, layout, recovery (no windows)
        run: bash scripts/test.sh

      - name: Compile the app shell without Xcode
        run: bash scripts/preview.sh --build-only

      - name: Build and check the CLI
        run: |
          bash scripts/build-cli.sh
          bash scripts/test-cli.sh

      - name: Build the app
        run: |
          brew install xcodegen
          bash scripts/build-app.sh
