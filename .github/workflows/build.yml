name: macOS Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test layout geometry
        run: bash scripts/test-layout.sh
      - name: Build local preview
        run: bash scripts/build-local.sh
      - name: Build
        run: xcodebuild -project Stickies.xcodeproj -scheme Stickies -configuration Debug CODE_SIGNING_ALLOWED=NO build
