name: macOS Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test layout geometry
        run: bash scripts/test-layout.sh
      - name: Compile without creating a launcher app
        run: bash scripts/build-local.sh
      - name: Test v2 compatibility and read-only installation gate
        run: bash scripts/test-compatibility.sh
      - name: Test Canvas without opening windows
        run: bash scripts/test-canvas.sh
      - name: Test layout snapshots and recovery without windows
        run: bash scripts/test-layout-store.sh
      - name: Test window mode preferences without windows
        run: bash scripts/test-window-mode.sh
      - name: Test Canvas board and recovery without windows
        run: bash scripts/test-canvas-board.sh
      - name: Test crash, lock and pending-save recovery without windows
        run: bash scripts/test-delivery-recovery.sh
      - name: Build
        run: xcodebuild -project Stickies.xcodeproj -scheme Stickies -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath build/.xcode.noindex build
      - name: Verify Xcode icon and identity
        run: python3 scripts/verify-xcode-bundle.py build/.xcode.noindex/Build/Products/Debug/iStickies2.app
      - name: Package universal delivery candidate without launching
        run: bash scripts/package-delivery.sh
