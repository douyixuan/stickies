name: Stickies
options:
  bundleIdPrefix: dev.douyixuan
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: '14.0'
targets:
  Stickies:
    type: application
    platform: macOS
    sources:
      - path: Stickies
      - path: Assets/iStickies2.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: iStickies2
        PRODUCT_BUNDLE_IDENTIFIER: dev.douyixuan.stickies
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Assets/Info.plist
        CODE_SIGNING_ALLOWED: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
